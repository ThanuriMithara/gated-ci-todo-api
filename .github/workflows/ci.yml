name: Gated CI Pipeline

on:
  push:
    branches: [ main, staging, dev ]
  pull_request:
    branches: [ main, staging, dev ]

jobs:
  # ─────────────────────────────────────────────────────────────
  # STAGE 1: Dependency Installation & Caching
  # ─────────────────────────────────────────────────────────────
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (clean)
        run: npm ci

  # ─────────────────────────────────────────────────────────────
  # STAGE 2: Code Quality & Linting Gate (Gate 1)
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint & Code Style Gate
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ─────────────────────────────────────────────────────────────
  # STAGE 3: Secrets Verification & Safety Gate (Gate 2)
  # Demonstrates secret masking & secure injection
  # ─────────────────────────────────────────────────────────────
  security-check:
    name: Secrets & Security Gate
    runs-on: ubuntu-latest
    needs: install
    env:
      APP_SECRET: ${{ secrets.APP_SECRET || 'ci-dummy-secret-value' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Secret Masking in Log Output
        run: |
          echo "=== Demonstrating Secrets Protection (Section 5.5) ==="
          echo "Injecting secret safely into environment..."
          echo "Notice how GitHub Actions automatically masks secrets:"
          echo "Secret value check: $APP_SECRET"
          echo "Secret is protected and not leaked in raw form."

  # ─────────────────────────────────────────────────────────────
  # STAGE 4: Automated Testing Gate with Coverage (Gate 3)
  # Blocking gate: Unit & Integration tests must pass
  # ─────────────────────────────────────────────────────────────
  test:
    name: Automated Tests Gate (Matrix)
    runs-on: ubuntu-latest
    needs: [lint, security-check]
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest Test Suite with Coverage
        run: npm test

      - name: Upload Test Coverage Artifact
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # STAGE 5: Artifact & Container Build Gate (Gate 4)
  # Only runs if all quality, security, and test gates pass
  # ─────────────────────────────────────────────────────────────
  build:
    name: Container Build Gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t gated-ci-todo-api:${{ github.sha }} .
          echo "✅ Quality Gates Passed. Docker image successfully created."

      - name: Verify Built Image
        run: docker images gated-ci-todo-api